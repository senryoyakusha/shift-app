name: Shift runtime aulne v0.9

on:
  push:
    branches:
      - chatgpt/runtime-aulne-v9

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-aulne-v9
          fetch-depth: 0
      - name: Patch runtime LIFF entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes()
          old = b'<script src="./direct-sync.js?v=2026-09-04.8"></script>'
          new = b'<script src="./direct-sync.js?v=2026-09-04.9"></script>'
          if data.count(old) == 1:
              data = data.replace(old, new, 1)
          elif data.count(new) != 1:
              raise SystemExit('unexpected runtime LIFF bootstrap entry')
          path.write_bytes(data)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "chore: force Shift runtime v0.9 cache refresh"
          git push origin HEAD:chatgpt/runtime-aulne-v9
