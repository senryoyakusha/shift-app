name: Aulne enji runtime v11

on:
  push:
    branches:
      - chatgpt/runtime-aulne-enji-v11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-aulne-enji-v11
          fetch-depth: 0
      - name: Patch runtime aulne colors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes()
          replacements = [
              (b'--aulne-g1: #8c4a3c; --aulne-g2: #c47f6d;', b'--aulne-g1: #8f2639; --aulne-g2: #c96675;'),
              (b'<script src="./direct-sync.js?v=2026-09-04.10"></script>', b'<script src="./direct-sync.js?v=2026-09-04.11"></script>'),
          ]
          changed = False
          for old, new in replacements:
              if new in data:
                  continue
              if data.count(old) != 1:
                  raise SystemExit(f'unexpected occurrence count for {old!r}: {data.count(old)}')
              data = data.replace(old, new, 1)
              changed = True
          if changed:
              path.write_bytes(data)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "style: mirror aulne enji red"
          git push origin HEAD:chatgpt/runtime-aulne-enji-v11
