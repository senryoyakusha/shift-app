name: Shift runtime dynamic stores v0.8

on:
  push:
    branches:
      - chatgpt/runtime-dynamic-stores-v8

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-dynamic-stores-v8
          fetch-depth: 0
      - name: Patch runtime Store support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          data = index.read_bytes()
          old = b'<script src="./direct-sync.js?v=2026-09-04.7"></script>'
          new = b'<script src="./direct-sync.js?v=2026-09-04.8"></script>'
          if data.count(old) == 1:
              data = data.replace(old, new, 1)
          elif data.count(new) != 1:
              raise SystemExit('unexpected runtime index bootstrap version')
          index.write_bytes(data)

          sync = Path('direct-sync.js')
          text = sync.read_text(encoding='utf-8')
          text = text.replace('var BOOTSTRAP_VERSION = "2026-09-04.7";', 'var BOOTSTRAP_VERSION = "2026-09-04.8";', 1)
          old_scripts = '    "./direct-status.js?v=" + encodeURIComponent(BOOTSTRAP_VERSION),\n    "./direct-read-pilot.js?v=" + encodeURIComponent(BOOTSTRAP_VERSION)\n'
          new_scripts = '    "./direct-status.js?v=" + encodeURIComponent(BOOTSTRAP_VERSION),\n    "./direct-read-pilot.js?v=" + encodeURIComponent(BOOTSTRAP_VERSION),\n    "./direct-store-ui.js?v=" + encodeURIComponent(BOOTSTRAP_VERSION)\n'
          if new_scripts not in text:
              if text.count(old_scripts) != 1:
                  raise SystemExit('unexpected runtime bootstrap script list')
              text = text.replace(old_scripts, new_scripts, 1)
          sync.write_text(text, encoding='utf-8')

          read = Path('direct-read-pilot.js')
          text = read.read_text(encoding='utf-8')
          old_user = '      stores: Array.isArray(user.stores) ? user.stores.map(String) : [],\n      is_boss: user.isBoss === true,\n'
          new_user = '      stores: Array.isArray(user.stores) ? user.stores.map(String) : [],\n      storeMemberships: Array.isArray(user.storeMemberships) ? user.storeMemberships : [],\n      is_boss: user.isBoss === true,\n'
          if new_user not in text:
              if text.count(old_user) != 1:
                  raise SystemExit('unexpected runtime user compatibility payload')
              text = text.replace(old_user, new_user, 1)
          read.write_text(text, encoding='utf-8')
          PY
      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html direct-sync.js direct-read-pilot.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: enable dynamic Store support in Shift runtime"
          git push origin HEAD:chatgpt/runtime-dynamic-stores-v8
