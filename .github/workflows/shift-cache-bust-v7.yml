name: Shift runtime cache bust v0.7

on:
  push:
    branches:
      - chatgpt/runtime-cache-bust-v7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-cache-bust-v7
          fetch-depth: 0
      - name: Patch runtime LIFF cache versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          direct = Path('direct-sync.js')

          index_bytes = index.read_bytes()
          old_entry = b'<script src="./direct-sync.js?v=2026-09-04.4"></script>'
          new_entry = b'<script src="./direct-sync.js?v=2026-09-04.7"></script>'
          if index_bytes.count(old_entry) != 1:
              raise SystemExit(f'expected exactly one runtime old entry, got {index_bytes.count(old_entry)}')
          index.write_bytes(index_bytes.replace(old_entry, new_entry))

          direct_bytes = direct.read_bytes()
          old_direct = b'var BOOTSTRAP_VERSION = "2026-09-04.6";'
          new_direct = b'var BOOTSTRAP_VERSION = "2026-09-04.7";'
          if direct_bytes.count(old_direct) != 1:
              raise SystemExit(f'expected exactly one runtime old bootstrap, got {direct_bytes.count(old_direct)}')
          direct.write_bytes(direct_bytes.replace(old_direct, new_direct))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html direct-sync.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "chore: force Shift runtime v0.7 cache refresh"
          git push origin HEAD:chatgpt/runtime-cache-bust-v7
